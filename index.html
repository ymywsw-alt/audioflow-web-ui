<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AudioFlow</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial; background:#0b0b0b; color:#fff; }
    .wrap { max-width:720px; margin:40px auto; padding:24px; }
    h1 { margin:0 0 8px; }
    p { color:#bbb; }
    .card { background:#141414; border:1px solid #222; border-radius:12px; padding:16px; margin-top:16px; }
    input, select, button { width:100%; padding:12px; margin-top:10px; border-radius:10px; border:1px solid #333; background:#0f0f0f; color:#fff; }
    button { background:#5b7cff; border:none; font-weight:800; cursor:pointer; }
    button[disabled]{ opacity:.6; cursor:not-allowed; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .result { margin-top:14px; }
    a { color:#9db0ff; }
    .muted { color:#9a9a9a; font-size:13px; margin-top:8px; }
    .ok { color:#cfd7ff; }
    .err { color:#ffb4b4; }
    .pill { display:inline-block; padding:3px 8px; border:1px solid #2a2a2a; border-radius:999px; font-size:12px; color:#cfcfcf; margin-left:6px; }
    .hint { margin-top:8px; padding:10px; border-radius:10px; border:1px solid #222; background:#101010; }
    .hint b { color:#dfe6ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AudioFlow</h1>
    <p>수익형 영상용 저작권 무리스크 BGM 생성</p>

    <div class="card">
      <input id="topic" placeholder="주제 (예: 파크골프 설명 영상)" />

      <div class="row">
        <!-- 프리셋 고정 -->
        <select id="preset">
          <option value="CALM_LOOP">CALM_LOOP (설명형/정보형 기본)</option>
          <option value="DOCUMENTARY">DOCUMENTARY (신뢰/다큐 톤)</option>
          <option value="UPBEAT_SHORTS">UPBEAT_SHORTS (숏폼/리듬)</option>
        </select>

        <!-- 길이 옵션 고정 -->
        <select id="duration">
          <option value="60">60s</option>
          <option value="90" selected>90s</option>
          <option value="120">120s</option>
        </select>
      </div>

      <div class="hint">
        <div><b>프리셋 선택 규칙(고정)</b></div>
        <div class="muted">
          • CALM_LOOP: 대부분의 롱폼 설명 영상 기본<br/>
          • DOCUMENTARY: 신뢰/차분/정보 전달 강화<br/>
          • UPBEAT_SHORTS: 숏폼 리듬감/전환용
        </div>
      </div>

      <button id="run">한 번에 생성</button>
      <div id="cool" class="muted" style="display:none;">재실행까지 <b id="cooln">10</b>초</div>
      <div class="muted">안전벨트: 연타/중복 요청 방지(10초 쿨다운)</div>
    </div>

    <div id="out" class="card result" style="display:none"></div>
  </div>

<script>
const ENGINE_URL = "https://audioflow-live.onrender.com";
const COOLDOWN_SEC = 10;

const PRESET_META = {
  CALM_LOOP: { label: "CALM_LOOP", use: "설명형/정보형 기본" },
  DOCUMENTARY: { label: "DOCUMENTARY", use: "신뢰/다큐 톤" },
  UPBEAT_SHORTS: { label: "UPBEAT_SHORTS", use: "숏폼/리듬" },
};

const ALLOWED_DUR = new Set([60, 90, 120]);

const btn = document.getElementById("run");
const out = document.getElementById("out");
const cool = document.getElementById("cool");
const cooln = document.getElementById("cooln");

let cooldownTimer = null;
let cooldownLeft = 0;

function setOut(html){
  out.style.display = "block";
  out.innerHTML = html;
}

function startCooldown(){
  cooldownLeft = COOLDOWN_SEC;
  cooln.textContent = String(cooldownLeft);
  cool.style.display = "block";

  if (cooldownTimer) clearInterval(cooldownTimer);
  cooldownTimer = setInterval(() => {
    cooldownLeft -= 1;
    if (cooldownLeft <= 0){
      clearInterval(cooldownTimer);
      cooldownTimer = null;
      cool.style.display = "none";
      btn.disabled = false;
      btn.textContent = "한 번에 생성";
      return;
    }
    cooln.textContent = String(cooldownLeft);
  }, 1000);
}

function safeText(s){
  return String(s ?? "").replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

btn.onclick = async () => {
  if (btn.disabled) return;

  const topic = (document.getElementById("topic").value || "").trim();
  const presetRaw = document.getElementById("preset").value;
  const preset = PRESET_META[presetRaw] ? presetRaw : "CALM_LOOP";

  const durRaw = Number(document.getElementById("duration").value || 90);
  const duration_sec = ALLOWED_DUR.has(durRaw) ? durRaw : 90;

  if (!topic){
    setOut(`<div class="err"><b>주제를 입력하세요.</b></div>`);
    return;
  }

  btn.disabled = true;
  btn.textContent = "생성 중…";
  cool.style.display = "none";
  setOut(`<div class="muted">생성 중… 잠시만 기다리세요.</div>`);

  try {
    const res = await fetch(ENGINE_URL + "/make", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ topic, preset, duration_sec })
    });

    if (res.status === 429){
      setOut(`<div class="err"><b>요청이 많아 잠시 대기해주세요.</b> <span class="pill">약 1분</span></div>`);
      startCooldown();
      return;
    }

    let j = null;
    try { j = await res.json(); } catch(e) {}

    if (!res.ok || !j || !j.ok){
      const code = (j && j.code) ? j.code : ("HTTP-" + res.status);
      setOut(`<div class="err"><b>에러 발생.</b> <span class="pill">${safeText(code)}</span><div class="muted">잠시 후 다시 시도하세요.</div></div>`);
      startCooldown();
      return;
    }

    const title = safeText(j.data?.title || `AudioFlow BGM`);
    const dp = safeText(j.data?.preset || preset);
    const ds = safeText(j.data?.duration_sec || duration_sec);
    const path = j.data?.audio?.download_url;

    if (!path){
      setOut(`<div class="err"><b>다운로드 링크 생성 실패.</b> <span class="pill">E-DL-001</span></div>`);
      startCooldown();
      return;
    }

    const use = PRESET_META[preset]?.use || "";

    setOut(`
      <div class="ok"><b>${title}</b></div>
      preset: ${dp} <span class="pill">${safeText(use)}</span><br/>
      duration: ${ds}s<br/><br/>
      <a href="${ENGINE_URL + path}" target="_blank" rel="noopener">
        ▶ 음원 다운로드
      </a>
      <div class="muted">길이/프리셋은 고정 옵션만 사용합니다.</div>
    `);

    startCooldown();

  } catch(e){
    setOut(`<div class="err"><b>네트워크 에러.</b> <span class="pill">E-NET-001</span><div class="muted">인터넷/엔진 상태를 확인 후 재시도하세요.</div></div>`);
    startCooldown();
  }
};
</script>
</body>
</html>
